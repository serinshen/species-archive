name: Enable GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Publish from main /
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${{ github.repository }}/pages"
          body='{"build_type":"legacy","source":{"branch":"main","path":"/"}}'
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" \
            -d "$body")
          echo "POST /pages -> ${code}"
          cat /tmp/pages.json
          echo
          if [ "$code" = "201" ] || [ "$code" = "200" ]; then
            exit 0
          fi
          code2=$(curl -sS -o /tmp/pages-put.json -w '%{http_code}' \
            -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" \
            -d "$body")
          echo "PUT /pages -> ${code2}"
          cat /tmp/pages-put.json
          echo
          if [ "$code2" = "200" ] || [ "$code2" = "204" ]; then
            exit 0
          fi
          exit 1
